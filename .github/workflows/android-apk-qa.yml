name: APK de pruebas (qa)

# Compila el APK `qa` con la dirección y la clave del backend tomadas de GitHub (#82). Corre solo en cada merge a `quality` (#90) y también se
# puede lanzar a mano (pestaña Actions); no corre en pull requests, así la clave no entra en cada compilación.
#   - Variable del repositorio: SMISHING_BACKEND_URL      (Settings > Secrets and variables > Actions > Variables)
#   - Secreto del repositorio:  SMISHING_BACKEND_API_KEY  (Settings > Secrets and variables > Actions > Secrets)
#   - Secreto del repositorio:  ANDROID_DEBUG_KEYSTORE_BASE64  (el debug.keystore compartido en base64; ver docs/apk-de-pruebas.md)
# El APK lleva la clave dentro: quien lo descargue puede extraerla. El repositorio es público y se acepta así (#90).
# Sin un keystore fijo, el runner genera una clave de depuración nueva en cada ejecución y cada APK tendría otra firma (#84): Android no deja
# instalar uno sobre el anterior sin desinstalar, y se pierden el historial y la cola de aportes.
#
# Cada APK lleva su propia versión: `<último tag>-qa.<número de ejecución>` (por ejemplo 1.0.0-qa.12), y el número de ejecución es también su
# `versionCode`, que siempre sube (#90). Un merge a `quality` además reemplaza el pre-release `qa-latest`, con el APK siempre con el mismo
# nombre (`smishy-qa.apk`): un solo lugar y un solo enlace para bajar el último.
on:
  push:
    branches: [quality]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-qa
  cancel-in-progress: false

jobs:
  build:
    name: android-apk-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    env:
      SMISHING_BACKEND_URL: ${{ vars.SMISHING_BACKEND_URL }}
      SMISHING_BACKEND_API_KEY: ${{ secrets.SMISHING_BACKEND_API_KEY }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Check the backend values
        run: |
          if [ -z "$SMISHING_BACKEND_URL" ]; then
            echo "::error::Falta la variable SMISHING_BACKEND_URL del repositorio. Sin ella el APK no enviaría aportes."
            exit 1
          fi
          if [ -z "$SMISHING_BACKEND_API_KEY" ]; then
            echo "::error::Falta el secreto SMISHING_BACKEND_API_KEY del repositorio. Sin él el APK no enviaría aportes."
            exit 1
          fi
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_DEBUG_KEYSTORE_BASE64 del repositorio. Sin él cada APK saldría con una firma distinta."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # Todos los tags, para saber cuál fue el último release.
          fetch-depth: 0
      - name: Work out the version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          base="${last#v}"
          base="${base:-1.0.0}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "name=$base-qa.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Versión de este APK: $base-qa.$GITHUB_RUN_NUMBER"
      - name: Use the shared debug keystore
        # El tipo `qa` se firma con la clave de depuración, que Gradle busca en `$ANDROID_USER_HOME/debug.keystore`. Escribirla en ~/.android no
        # bastó en el runner (las dos primeras pruebas siguieron saliendo con firmas distintas), así que se fija ANDROID_USER_HOME de forma explícita.
        run: |
          mkdir -p "$RUNNER_TEMP/android-user"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-user/debug.keystore"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the qa APK
        run: >
          ./gradlew assembleQa
          -Psmishing.versionName=${{ steps.version.outputs.base }}
          -Psmishing.versionCode=${{ github.run_number }}
          -Psmishing.qaBuild=${{ github.run_number }}
          --warning-mode fail --stacktrace
      - name: Check the version
        # Falla si el APK no quedó con la versión que se calculó: sería imposible distinguir una compilación de otra.
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging app/build/outputs/apk/qa/app-qa.apk | head -n 1)
          echo "$BADGING"
          case "$BADGING" in
            *"versionName='${{ steps.version.outputs.name }}'"*"versionCode='${{ github.run_number }}'"*|*"versionCode='${{ github.run_number }}'"*"versionName='${{ steps.version.outputs.name }}'"*) ;;
            *) echo "::error::El APK no quedó con la versión ${{ steps.version.outputs.name }} (código ${{ github.run_number }})."; exit 1 ;;
          esac
      - name: Check the signing certificate
        # La huella SHA-256 del certificado no es secreta. Falla si el APK no quedó firmado con el keystore compartido, para no entregar uno con otra firma.
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK_SHA=$("$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/qa/app-qa.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //' | tr -d ':\r ' | tr 'A-F' 'a-f')
          KEY_SHA=$(keytool -list -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android | grep "SHA-256" | sed 's/.*: //' | tr -d ':\r ' | tr 'A-F' 'a-f')
          echo "Certificado del APK:       $APK_SHA"
          echo "Certificado del keystore:  $KEY_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::El APK no quedó firmado con el keystore compartido (ANDROID_DEBUG_KEYSTORE_BASE64). Tendría una firma distinta a la de otras compilaciones."
            exit 1
          fi
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload the R8 mapping
        # El APK está minificado (#24): sin este archivo, los errores que traiga no se pueden traducir a los nombres reales del código. No lleva secretos.
        uses: actions/upload-artifact@v4
        with:
          name: app-qa-mapping
          path: app/build/outputs/mapping/qa/mapping.txt
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish-qa-latest
    # Solo lo que sale de `quality` reemplaza `qa-latest`: una ejecución manual desde otra rama deja solo el artefacto.
    if: github.ref == 'refs/heads/quality'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-qa-*
          merge-multiple: true
          path: dist
      - name: Update the qa-latest pre-release
        run: |
          mv dist/app-qa.apk dist/smishy-qa.apk
          mv dist/mapping.txt dist/mapping-qa.txt
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/qa-latest/smishy-qa.apk"
          cat > notes.md <<EOF
          APK de **pruebas internas** (tipo \`qa\`) del último merge a \`quality\`. **Este release se reemplaza en cada merge**: siempre es lo más reciente.

          - **Versión:** \`$VERSION\` (se ve en *Ajustes › Acerca de*)
          - **Commit:** \`${GITHUB_SHA::7}\`
          - **Descarga directa:** $URL

          No es una versión para el público ni está en Google Play. Trae la dirección y la clave del backend de aportes. \`mapping-qa.txt\` sirve para leer los errores del APK (R8).
          EOF
          if gh release view qa-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # El tag se mueve al commit nuevo; el release y su enlace siguen siendo los mismos.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/qa-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit qa-latest --repo "$GITHUB_REPOSITORY" --title "APK de pruebas (qa) $VERSION" --notes-file notes.md --prerelease
            gh release upload qa-latest dist/smishy-qa.apk dist/mapping-qa.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create qa-latest dist/smishy-qa.apk dist/mapping-qa.txt --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --title "APK de pruebas (qa) $VERSION" --notes-file notes.md
          fi
          echo "Descarga directa: $URL"
